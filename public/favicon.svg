<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Cool ring (left) -->
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="4" y1="8" x2="20" y2="24">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Warm ring (right) -->
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="12" y1="8" x2="28" y2="24">
      <stop offset="0" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Two gradient ring outlines: small padding on all sides, viewBox stays square -->
  <circle cx="12.05" cy="16" r="8.3" fill="none" stroke="url(#gA)" stroke-width="3.4"/>
  <circle cx="19.95" cy="16" r="8.3" fill="none" stroke="url(#gB)" stroke-width="3.4"/>
</svg>
