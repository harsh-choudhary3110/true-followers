<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Cool ring (left) -->
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="6.68" y1="9.79" x2="19.11" y2="22.21">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Warm ring (right) -->
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="12.89" y1="9.79" x2="25.32" y2="22.21">
      <stop offset="0" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Two gradient ring outlines, padded to match the manifest icons (~16% sides,
       ~26% top/bottom) so the mark doesn't touch the edge of circular favicon
       badges like Google's search results. viewBox stays square. -->
  <circle cx="12.93" cy="16" r="6.45" fill="none" stroke="url(#gA)" stroke-width="2.64"/>
  <circle cx="19.07" cy="16" r="6.45" fill="none" stroke="url(#gB)" stroke-width="2.64"/>
</svg>
